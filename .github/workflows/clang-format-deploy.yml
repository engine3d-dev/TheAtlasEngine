name: clang-format Check
on: [pull_request]
jobs:
  formatting-check:
    name: Formatting Check
    runs-on: ubuntu-latest
    steps:
    - name: 🚀 Checkout Repository
      uses: actions/checkout@v4

    - name: 🌐 Downloading .clang-format from TheAtlasEngine
      run: wget https://raw.githubusercontent.com/engine3d-dev/TheAtlasEngine/main/.clang-format -O .clang-format
    
    - name: 🔍 Check Runner Clang-Format Version
      run: |
        clang-format --version
        which clang-format

    - uses: actions/checkout@v4
    - name: Run clang-format style check for C/C++/Protobuf programs.
      uses: jidicula/clang-format-action@v4.14.0
      with:
        clang-format-version: 19
        check-path: '.'
        include-regex: '.*\.(c|cpp|h|hpp|cppm|ixx)$'
        fallback-style: 'none' # optional
