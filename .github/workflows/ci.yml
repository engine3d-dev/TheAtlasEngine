  linux:
    uses: engine3d-dev/ci/.github/workflows/linux.yml@main
    with:
      package_name: "TheAtlasEngine"
      version: "0.5"
    secrets: inherit

  mac:
    uses: engine3d-dev/ci/.github/workflows/mac.yml@main
    with:
      package_name: "TheAtlasEngine"
      version: "0.5"
    secrets: inherit